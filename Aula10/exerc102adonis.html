<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Simples</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #fff6d6, #d9f7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 20px;
      width: 320px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #ff9800;
    }

    .operacoes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      color: white;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.05);
    }

    .soma {
      background: #ff6b6b;
    }

    .sub {
      background: #4ecdc4;
    }

    .mult {
      background: #ffa502;
    }

    .div {
      background: #6c5ce7;
    }

    #result {
      background: #f7f7f7;
      font-weight: bold;
      text-align: center;
      color: #333;
    }

    .emoji {
      display: block;
      font-size: 28px;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h2>🍓 Calculadora de Feira 🍍</h2>

    <input type="number" id="num1" placeholder="Digite o primeiro número">

    <input type="number" id="num2" placeholder="Digite o segundo número">

    <div class="operacoes">

      <button class="soma" onclick="calculate('+')">
        <span class="emoji">🍎</span>
        +
      </button>

      <button class="sub" onclick="calculate('-')">
        <span class="emoji">🍉</span>
        −
      </button>

      <button class="mult" onclick="calculate('*')">
        <span class="emoji">🍌</span>
        ×
      </button>

      <button class="div" onclick="calculate('/')">
        <span class="emoji">🍇</span>
        ÷
      </button>

    </div>

    <input type="text" id="result" placeholder="Resultado" readonly>
  </div>

  <script>
    function calculate(op) {

      const num1 = parseFloat(document.getElementById("num1").value);
      const num2 = parseFloat(document.getElementById("num2").value);

      const resultField = document.getElementById("result");

      if (isNaN(num1) || isNaN(num2)) {
        resultField.value = "Digite números válidos";
        return;
      }

      let result;

      switch(op) {

        case '+':
          result = num1 + num2;
          break;

        case '-':
          result = num1 - num2;
          break;

        case '*':
          result = num1 * num2;
          break;

        case '/':
          if (num2 === 0) {
            resultField.value = "Erro: divisão por zero";
            return;
          }

          result = num1 / num2;
          break;
      }

      resultField.value = result;
    }
  </script>

</body>
</html>
