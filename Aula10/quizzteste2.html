<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz Musical</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2, h3 {
      color: #333;
    }

    button {
      margin: 5px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .btn1 { background-color: #3498db; color: white; }
    .btn2 { background-color: #2ecc71; color: white; }
    .btn3 { background-color: #e74c3c; color: white; }

    .btn4 { background-color: #9b59b6; color: white; }
    .btn5 { background-color: #f39c12; color: white; }
    .btn6 { background-color: #1abc9c; color: white; }

    .btn-apostar {
      background-color: #6a1b9a;
      color: white;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .cantora-layout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .foto-box {
      width: 260px;
      height: 260px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #ddd;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .foto-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #resultado {
      margin-top: 15px;
      font-weight: bold;
      font-size: 16px;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- Título -->
  <div class="box">

    <h2>🎵 Quiz Musical</h2>

    <p>
      Escolha uma música, descubra a cantora correta
      e aposte nas visualizações!
    </p>

  </div>

  <!-- Letra -->
  <div class="box">

    <h3>🎶 Letra</h3>

    <p id="letraTexto">
      Clique em uma música para visualizar um trecho.
    </p>

  </div>

  <!-- Músicas -->
  <div class="box">

    <h3>🎧 Escolha uma música</h3>

    <button class="btn1" onclick="selecionarMusica(1)">
      Whenever, Wherever
    </button>

    <button class="btn2" onclick="selecionarMusica(2)">
      La Isla Bonita
    </button>

    <button class="btn3" onclick="selecionarMusica(3)">
      Born This Way
    </button>

  </div>

  <!-- Cantoras -->
  <div class="box">

    <h3>⭐ Quem canta?</h3>

    <div class="cantora-layout">

      <div>

        <button class="btn4" onclick="verificarCantora('Lady Gaga')">
          Lady Gaga
        </button>

        <button class="btn5" onclick="verificarCantora('Shakira')">
          Shakira
        </button>

        <button class="btn6" onclick="verificarCantora('Madonna')">
          Madonna
        </button>

        <p id="resultado"></p>

      </div>

      <div class="foto-box">

        <img id="fotoCantora" src="" alt="Cantora">

      </div>

    </div>

  </div>

  <!-- Apostas -->
  <div class="box">

    <h3>💰 Aposte nas views</h3>

    <p>
      Quantas visualizações essa música teve no YouTube?
    </p>

    <input
      type="number"
      id="inputAposta"
      placeholder="Digite um valor"
    >

    <button class="btn-apostar" onclick="apostar()">
      Apostar
    </button>

  </div>

</div>

<script>

  let musicaSelecionada = "";

  const foto =
  document.getElementById("fotoCantora");

  function selecionarMusica(id) {

    const letra =
    document.getElementById("letraTexto");

    if (id === 1) {

      musicaSelecionada =
      "Whenever, Wherever";

      letra.innerText =
      "Whenever, wherever / We're meant to be together...";

    }

    else if (id === 2) {

      musicaSelecionada =
      "La Isla Bonita";

      letra.innerText =
      "Last night I dreamt of San Pedro / Just like I'd never gone...";

    }

    else if (id === 3) {

      musicaSelecionada =
      "Born This Way";

      letra.innerText =
      "I'm beautiful in my way / 'Cause God makes no mistakes...";

    }

  }

  function verificarCantora(nome) {

    const resultado =
    document.getElementById("resultado");

    if (!musicaSelecionada) {

      alert("Escolha uma música primeiro!");

      return;

    }

    // FOTO DAS CANTORAS

    if (nome === "Shakira") {

      foto.src =
      "https://cdn-p.smehost.net/sites/60079b7e675c4a71bedaa2bc464651ee/wp-content/uploads/2026/05/6XJ-11SI-1536x768.png";

    }

    else if (nome === "Lady Gaga") {

      foto.src =
      "https://gcp-na-images.contentstack.com/v3/assets/bltea6093859af6183b/blt72db0e348f532cf5/6986856ccd804d9942cc9baa/476413459.jpg?branch=production&width=750&quality=75&auto=webp&crop=3:2";

    }

    else if (nome === "Madonna") {

      foto.src =
      "https://garotasestupidas.com/wp-content/uploads/2025/08/SnapInsta.to_527311344_18529225123058553_3620452725407568041_n.jpg";

    }

    foto.style.display = "block";

    // VERIFICAR RESPOSTA

    if (

      (musicaSelecionada === "Whenever, Wherever"
      && nome === "Shakira")

      ||

      (musicaSelecionada === "La Isla Bonita"
      && nome === "Madonna")

      ||

      (musicaSelecionada === "Born This Way"
      && nome === "Lady Gaga")

    ) {

      resultado.innerText =
      "✅ Correto! " +
      nome +
      " canta " +
      musicaSelecionada;

      resultado.style.color = "green";

    }

    else {

      resultado.innerText =
      "❌ Errado! " +
      nome +
      " não canta essa música.";

      resultado.style.color = "red";

    }

  }

  function apostar() {

    const aposta =
    document.getElementById("inputAposta").value;

    if (!aposta) {

      alert("Digite um valor!");

    }

    else {

      alert(
        "🎉 Você apostou " +
        aposta +
        " views!"
      );

    }

  }

</script>

</body>
</html>
